<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Header -->
        <div class="header">
            <h1>Calculator</h1>
            <button id="angleMode" onclick="toggleAngleMode()">DEG</button>
        </div>

        <!-- Display -->
        <div class="display-container">
            <div id="expression">0</div>
            <div id="result">0</div>
        </div>


        <div class="scientific-buttons">

            <button onclick="appendFunction('sin(')">sin</button>
            <button onclick="appendFunction('cos(')">cos</button>
            <button onclick="appendFunction('tan(')">tan</button>

            <button onclick="appendFunction('asin(')">sin⁻¹</button>
            <button onclick="appendFunction('acos(')">cos⁻¹</button>
            <button onclick="appendFunction('atan(')">tan⁻¹</button>

            <button onclick="appendFunction('log(')">log</button>
            <button onclick="appendFunction('ln(')">ln</button>
            <button onclick="appendFunction('sqrt(')">√</button>

            <button onclick="appendValue('^2')">x²</button>
            <button onclick="appendValue('^')">xʸ</button>
            <button onclick="appendFunction('factorial(')">n!</button>

            <button onclick="appendValue('π')">π</button>
            <button onclick="appendValue('e')">e</button>
            <button onclick="appendValue('%')">%</button>

        </div>

       
        
        <div class="buttons">

            <button class="clear" onclick="clearCalculator()">AC</button>
            <button class="delete" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="appendValue('(')">(</button>
            <button class="operator" onclick="appendValue(')')">)</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('0')" class="zero">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="answer" onclick="useAnswer()">Ans</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

        
        <div class="history-section">
            <div class="history-header">
                <h2>History</h2>
                <button onclick="clearHistory()">Clear</button>
            </div>

            <div id="history"></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
